name: DataPeople
description: 'Datapeople is an AI-powered job description management platform (acquired
  by PayScale) that helps talent and recruiting teams centralize, standardize, and
  optimize their job content across the hiring workflow. Its products include a Smart
  Editor for job-content management, a First Draft writing AI, Insights performance
  and compliance analytics, Guidance and Compliance AI for review and recommendations,
  and Datapeople Anywhere, which surfaces its guidance inside existing ATS and HRIS
  systems. Datapeople integrates with applicant tracking systems including Workday,
  SAP SuccessFactors, Greenhouse, SmartRecruiters, iCIMS, Lever, and Gr8People. The
  company publishes no public developer API, portal, or OpenAPI; its integration surface
  is delivered through native ATS/HRIS connectors rather than a self-serve API.'
